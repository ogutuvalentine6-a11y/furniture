{% extends 'admin/_base.html' %}
{% block admin_content %}
<h1 class="font-display text-3xl mb-6">{{ 'Edit product' if product else 'New product' }}</h1>

<form method="post" class="bg-white border border-beige rounded-2xl p-6 space-y-4 max-w-3xl">
  <div class="grid md:grid-cols-2 gap-4">
    <div class="md:col-span-2">
      <label class="block text-sm text-grey mb-1">Name</label>
      <input name="name" required value="{{ product.name if product else '' }}"
             class="w-full px-3 py-2 border border-beige rounded-lg focus:outline-none focus:border-oak">
    </div>
    <div>
      <label class="block text-sm text-grey mb-1">Category</label>
      <select name="category_id" required class="w-full px-3 py-2 border border-beige rounded-lg bg-white">
        <option value="">— select —</option>
        {% for c in categories %}
          <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm text-grey mb-1">Price</label>
      <input name="price" type="number" step="0.01" min="0" required
             value="{{ '%.0f'|format(product.price) if product else '0.00' }}"
             class="w-full px-3 py-2 border border-beige rounded-lg focus:outline-none focus:border-oak">
    </div>
    <div>
      <label class="block text-sm text-grey mb-1">Stock</label>
      <input name="stock" type="number" min="0" required
             value="{{ product.stock if product else 0 }}"
             class="w-full px-3 py-2 border border-beige rounded-lg focus:outline-none focus:border-oak">
    </div>
    <div>
      <label class="block text-sm text-grey mb-1">Material</label>
      <input name="material" value="{{ product.material if product else '' }}"
             class="w-full px-3 py-2 border border-beige rounded-lg focus:outline-none focus:border-oak">
    </div>
    <div>
      <label class="block text-sm text-grey mb-1">Dimensions</label>
      <input name="dimensions" value="{{ product.dimensions if product else '' }}"
             class="w-full px-3 py-2 border border-beige rounded-lg focus:outline-none focus:border-oak">
    </div>
    <div>
      <label class="block text-sm text-grey mb-1">Colours (comma separated)</label>
      <input name="colors" value="{{ product.colors if product else '' }}"
             class="w-full px-3 py-2 border border-beige rounded-lg focus:outline-none focus:border-oak">
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm text-grey mb-1">Image URL (https://… or path under /static/)</label>
      <input name="image" value="{{ product.image if product else '' }}"
             class="w-full px-3 py-2 border border-beige rounded-lg focus:outline-none focus:border-oak">
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm text-grey mb-1">Description</label>
      <textarea name="description" rows="4"
                class="w-full px-3 py-2 border border-beige rounded-lg focus:outline-none focus:border-oak">{{ product.description if product else '' }}</textarea>
    </div>
  </div>

  <div class="flex flex-wrap gap-4 text-sm pt-2">
    {% for field, label in [('is_featured','Featured'),('is_bestseller','Best seller'),('is_new','New arrival')] %}
      <label class="flex items-center gap-2">
        <input type="checkbox" name="{{ field }}"
               {% if product and product[field] %}checked{% endif %}>
        {{ label }}
      </label>
    {% endfor %}
  </div>

  <div class="flex gap-3 pt-4">
    <button class="bg-charcoal text-ivory px-6 py-2 rounded-full hover:bg-oak transition-colors text-sm">
      {{ 'Save changes' if product else 'Create product' }}
    </button>
    <a href="{{ url_for('admin.products') }}" class="px-6 py-2 rounded-full border border-charcoal hover:bg-charcoal hover:text-ivory transition-colors text-sm">Cancel</a>
  </div>
</form>
{% endblock %}
