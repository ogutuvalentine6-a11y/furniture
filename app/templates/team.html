{% extends 'base.html' %}
{% block title %}The Team — Group 11{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16">

  <div class="text-center mb-12 reveal">
    <div class="inline-block text-xs uppercase tracking-[0.25em] text-oak bg-oak/10 border border-oak/30 px-4 py-1.5 rounded-full mb-4">
      The Team
    </div>
    <h1 class="font-display text-5xl lg:text-6xl">Group <span class="text-oak">11</span></h1>
    <p class="text-grey mt-4 max-w-2xl mx-auto">Group B · Software Engineering</p>
  </div>

  <div class="space-y-3">
    {% for m in members %}
      <a href="{{ url_for('main.team_member', member_id=m.id) }}"
         class="group flex items-center justify-between gap-4 bg-white border border-beige rounded-2xl px-6 py-5 hover:border-charcoal transition-all hover:-translate-y-0.5 hover:shadow-lg">
        <div class="font-display text-xl text-charcoal group-hover:text-oak transition-colors">{{ m.name }}</div>
        <div class="text-sm text-grey font-mono whitespace-nowrap">{{ m.reg }}</div>
      </a>
    {% endfor %}
  </div>

  <div class="mt-12 text-center">
    <a href="{{ url_for('main.index') }}" class="inline-block bg-charcoal text-ivory px-6 py-3 rounded-full hover:bg-oak transition-colors">← Back to store</a>
  </div>

</div>
{% endblock %}
